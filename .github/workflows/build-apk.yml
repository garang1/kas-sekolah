name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true
          "$ANDROID_HOME/platform-tools/adb" version || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create debug keystore
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            keytool -genkeypair \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          else
            echo "debug.keystore already exists"
          fi

      - name: Build Debug APK with Gradle
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/Kas-Simapas-v5.9.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kas-Simapas-APK
          path: release_apk/Kas-Simapas-v5.9.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v5.9-${{ github.run_number }}"
          name: "Kas Simapas v5.9 (Rilis #${{ github.run_number }})"
          body: |
            ### 📱 Aplikasi Kas Simapas (Buku Kas Pintar)
            File APK siap diinstal langsung ke perangkat HP Android (Kepala Sekolah & Bendahara).
            
            #### 📥 Panduan Instalasi:
            1. Unduh file **Kas-Simapas-v5.9.apk** di bagian **Assets** di bawah.
            2. Buka file di HP Android.
            3. Jika muncul peringatan keamanan, pilih **Setelan** lalu aktifkan **Izinkan dari sumber ini**.
            4. Klik **Instal**.
          draft: false
          prerelease: false
          files: release_apk/Kas-Simapas-v5.9.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
