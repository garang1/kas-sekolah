name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ubuntu-latest already includes the Android SDK. The setup-android action
    # currently tries to install the obsolete `tools` package and fails before
    # Gradle can start, so use the runner's maintained SDK installation.
    - name: Verify Android SDK
      run: |
        echo "ANDROID_HOME=${ANDROID_HOME}"
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true
        "$ANDROID_HOME/platform-tools/adb" version || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Kas-Simapas-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
