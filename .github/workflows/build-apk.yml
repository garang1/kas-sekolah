name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug

    - name: Rename APK
      run: |
        mkdir -p release_apk
        cp app/build/outputs/apk/debug/app-debug.apk release_apk/Kas-Simapas-v5.9.apk

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v5.9
        name: "Kas Simapas v5.9 (APK Siap Pasang)"
        body: |
          Aplikasi Buku Kas Pintar (Kas Simapas) untuk Android.
          
          ### Cara Instal:
          1. Unduh file **Kas-Simapas-v5.9.apk** di bawah ini.
          2. Buka file di HP Android dan pasang (izinkan instalasi dari sumber tidak dikenal jika diminta).
        files: release_apk/Kas-Simapas-v5.9.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
